name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: cruzei
          POSTGRES_PASSWORD: cruzei_dev
          POSTGRES_DB: cruzei
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cruzei"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cruzei:cruzei_dev@localhost:5432/cruzei
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-32-chars-minimum-length-ok
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cruzei/shared-types build
      - run: pnpm --filter @cruzei/shared-utils build
      - run: pnpm --filter @cruzei/backend lint
      - run: pnpm --filter @cruzei/backend typecheck
      - run: pnpm --filter @cruzei/backend test

  mobile:
    name: Mobile (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cruzei/shared-types build
      - run: pnpm --filter @cruzei/shared-utils build
      - run: pnpm --filter @cruzei/ui-mobile build
      - run: pnpm --filter @cruzei/mobile lint
      - run: pnpm --filter @cruzei/mobile typecheck
